async function browse(append=false){const request=++browseRequest;const button=$('#load-more');button.disabled=true;try{const q=$('#search').value.trim();const d=await api('/api/search?type='+encodeURIComponent(view)+'&page='+pageNumber+'&q='+encodeURIComponent(q)+(activeGenre?'&genre='+activeGenre.id:''));if(request!==browseRequest||view==='home'||view==='list')return;const found=(d.results||[]).filter(x=>x.poster_path&&x.media_type!=='person').map(normalize);browseItems=append?[...new Map([...browseItems,...found].map(x=>[x.slug,x])).values()]:found;renderGrid(browseItems,activeGenre?activeGenre.name:q?'Results for “'+q+'”':({movie:'Movies',tv:'TV Shows',anime:'Anime & Animation',search:'Discover'}[view]||'Discover'));button.classList.toggle('hidden',pageNumber>=(d.total_pages||1))}catch{toast('Could not load the catalog. Please try again.')}finally{button.disabled=false}}

async function openDetails(x,play=false){if(!x)return;stopPlayer();selected=x;detail=null;season=1;episode=1;$('#details').classList.remove('playing');$('#detail-title').textContent=x.title;$('#dialog-art').style.backgroundImage='url("'+(x.background||x.image||x.poster)+'")';$('#detail-meta').textContent=(x.release_date?.slice(0,4)||'')+' · '+(x.mediaType==='tv'?'TV Show':'Movie');$('#detail-story').textContent='Loading details…';$('#detail-save').textContent=isSaved(x)?'✓ In watchlist':'＋ Watchlist';$('#episodes').classList.add('hidden');$('#detail-play').disabled=false;$('#detail-play').textContent='▶ Play now';if(!$('#details').open)$('#details').showModal();$('#details').scrollTop=0;try{const d=await api('/api/detail?path='+encodeURIComponent(x.slug));if(selected?.slug!==x.slug)return;detail=d;$('#detail-story').textContent=d.desc||x.description||'';$('#detail-meta').innerHTML='<span class="star">★ '+esc(d.score)+'</span><span>'+esc(d.year)+'</span><span>'+esc(d.certification)+'</span><span>'+esc((d.categories||[]).join(' · '))+'</span>';if(d.mediaType==='tv'&&d.seasons?.length){$('#episodes').classList.remove('hidden');$('#season').innerHTML=d.seasons.filter(s=>s.season_number>0).map(s=>'<option value="'+s.season_number+'">'+esc(s.name)+' · '+s.episode_count+' episodes</option>').join('');season=Number($('#season').value);loadSeason()}if(play)startPlayback()}catch{if(selected?.slug===x.slug){$('#detail-story').textContent='Could not load title details. You can retry playback.';if(play)startPlayback()}}}
async function loadSeason(){const path=selected.slug,n=season;$('#episode-list').innerHTML='<p class="play-status">Loading episodes…</p>';try{const d=await api('/api/season?path='+encodeURIComponent(path)+'&season='+n);if(selected?.slug!==path||season!==n)return;$('#episode-list').innerHTML=(d.episodes||[]).map(e=>'<button data-episode="'+e.episode_number+'" class="'+(e.episode_number===episode?'active':'')+'"><b>'+e.episode_number+'</b><span>'+esc(e.name)+'<small>'+esc(e.air_date||'')+(e.runtime?' · '+e.runtime+' min':'')+'</small></span></button>').join('')}catch{$('#episode-list').textContent='Episodes unavailable. Try again.'}}
async function subtitleControl(video,tracks,toolbar,current){const group=document.createElement('div');group.className='control-group';const label=document.createElement('label');label.htmlFor='subtitles';label.textContent='Subtitles';const picker=document.createElement('select');picker.id='subtitles';picker.setAttribute('aria-label','Subtitle language');picker.add(new Option('Off','off'));const langs=new Set();tracks.forEach((s,i)=>{const duplicate=langs.has(s.language);if(duplicate&&s.language!=='ar')return;langs.add(s.language);picker.add(new Option((s.language==='ar'?'العربية':s.label)+(duplicate?' · '+s.release.slice(0,45):''),String(i)))});group.append(label,picker);toolbar.append(group);const ar=tracks.findIndex(s=>s.language==='ar');const note=document.createElement('p');note.className='sub-note';if(ar<0)note.textContent='Arabic subtitles are not available for this title. Choose another language or keep subtitles off.';$('#player').append(note);const change=()=>{video.querySelectorAll('track').forEach(e=>e.remove());if(picker.value==='off')return;const s=tracks[Number(picker.value)],track=document.createElement('track');track.kind='subtitles';track.label=s.label;track.srclang=s.language;track.src=s.url;track.default=true;track.addEventListener('load',()=>{if(current()){track.track.mode='showing';if(s.language==='ar')note.textContent='العربية · Arabic subtitles enabled'}});track.addEventListener('error',()=>{if(current())note.textContent='This subtitle track could not be loaded. Try another track.'});video.append(track);track.track.mode='showing'};picker.onchange=change;picker.value=ar>=0?String(ar):'off';change()}
async function browserPlaybackSources(metadata,seasonNumber,episodeNumber){
 const base='https://api.wecollege.net';
 const read=async(url,asText=false)=>{const r=await fetch(url,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('Source service unavailable');return asText?r.text():r.json()};
 const seed=await read(base+'/seed?mediaId='+metadata.tmdbId);
 const params=new URLSearchParams({title:encodeURIComponent(metadata.titleEnglish||metadata.title),mediaType:metadata.mediaType,year:String(metadata.year||''),totalSeasons:String(metadata.seasons?.length||0),tmdbId:String(metadata.tmdbId),imdbId:metadata.imdbId||'',enc:'2',seed:seed.seed});
 const subQuery=new URLSearchParams({id:metadata.tmdbId});
 if(metadata.mediaType==='tv'){params.set('seasonId',String(seasonNumber));params.set('episodeId',String(episodeNumber));subQuery.set('season',String(seasonNumber));subQuery.set('episode',String(episodeNumber))}
 const subtitlePromise=read('https://subtitles.vidy.st/search?'+subQuery).catch(()=>[]);
 let result;
 for(const provider of ['miami','boise','seattle']){
  try{const payload=await read(base+'/'+provider+'/sources?'+params,true);const decoded=JSON.parse(decodeMovyPayload(payload,seed.seed,metadata.tmdbId));if(decoded.sources?.length){result=decoded;break}}catch{}
 }
 if(!result)throw Error('No video source available');
 const tracks=await subtitlePromise;
 const response=await fetch('/api/prepare',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sources:result.sources,subtitles:tracks}),signal:AbortSignal.timeout(15000)});
 if(!response.ok)throw Error('Could not prepare playback');
 return response.json();
}

async function startPlayback(){if(!selected)return;const x=selected;stopPlayer();const id=playID;const current=()=>playID===id&&selected?.slug===x.slug;$('#details').classList.add('playing');$('#details').scrollTop=0;$('#detail-play').disabled=true;$('#detail-play').textContent='Loading…';$('#player').innerHTML='<p class="notice" role="status">Finding the best available video and Arabic subtitles…</p>';try{const metadata=detail||await api('/api/detail?path='+encodeURIComponent(x.slug));if(!current())return;const data=await browserPlaybackSources(metadata,season,episode);if(!current())return;$('#player').replaceChildren();if(!data.sources?.length)throw Error('No sources');const video=document.createElement('video');video.controls=true;video.autoplay=true;video.playsInline=true;$('#player').append(video);const toolbar=document.createElement('div');toolbar.className='player-toolbar';$('#player').append(toolbar);const group=document.createElement('div');group.className='control-group';const label=document.createElement('label');label.htmlFor='video-quality';label.textContent='Quality';const picker=document.createElement('select');picker.id='video-quality';picker.setAttribute('aria-label','Video quality');picker.add(new Option('Best available · '+data.sources[0].label,'best'));data.sources.forEach((s,i)=>picker.add(new Option(s.label+(s.height>=2160?' · 4K':''),String(i))));group.append(label,picker);toolbar.append(group);const status=document.createElement('p');status.className='play-status';status.setAttribute('role','status');$('#player').append(status);let chosen=0,activeSource=-1,started=false,stallTimer=null;
const clearStall=()=>{clearInterval(stallTimer);stallTimer=null};playbackCleanup=clearStall;
const loadSource=(index,remember=true)=>{if(!current())return;clearStall();const snap={position:video.currentTime||0,paused:started&&remember?video.paused:false,rate:video.playbackRate,volume:video.volume,muted:video.muted};started=true;activeSource=index;if(hls){hls.destroy();hls=null}video.autoplay=!snap.paused;status.textContent='Selected: '+data.sources[index].label+' · '+(x.mediaType==='tv'?'Season '+season+', episode '+episode+' · ':'')+'Arabic preferred';video.onloadedmetadata=()=>{if(!current())return;if(snap.position>0)video.currentTime=Math.min(snap.position,Number.isFinite(video.duration)?video.duration-.1:snap.position);video.playbackRate=snap.rate;video.volume=snap.volume;video.muted=snap.muted;if(!snap.paused)video.play().catch(()=>{});else video.pause()};if(window.Hls?.isSupported()){const engine=new Hls({startPosition:snap.position,manifestLoadPolicy:{default:{maxTimeToFirstByteMs:10000,maxLoadTimeMs:15000,timeoutRetry:{maxNumRetry:1,retryDelayMs:500,maxRetryDelayMs:1000},errorRetry:{maxNumRetry:1,retryDelayMs:500,maxRetryDelayMs:1000}}}});hls=engine;engine.on(Hls.Events.ERROR,(_,e)=>{if(!current()||hls!==engine||!e.fatal)return;clearStall();if(picker.value==='best'&&index+1<data.sources.length){toast(data.sources[index].label+' unavailable in this browser. Trying '+data.sources[index+1].label+'.');loadSource(index+1,false)}else{video.pause();status.setAttribute('role','alert');status.textContent='This video version could not be played. Select another quality or retry.'}});engine.loadSource(data.sources[index].url);engine.attachMedia(video)}else if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=data.sources[index].url;else status.textContent='This browser does not support the video format.';
let lastTime=video.currentTime,lastProgress=Date.now();stallTimer=setInterval(()=>{if(!current()){clearStall();return}if(video.currentTime>lastTime+.05){lastTime=video.currentTime;lastProgress=Date.now();return}if(video.paused&&video.readyState>=3){lastProgress=Date.now();return}if(Date.now()-lastProgress<18000)return;clearStall();if(picker.value==='best'&&index+1<data.sources.length){toast('The video is not responding. Trying '+data.sources[index+1].label+'.');loadSource(index+1,false)}else{if(hls){hls.destroy();hls=null}video.pause();status.setAttribute('role','alert');status.textContent='The video source stopped responding. Choose another quality or retry playback.'}},1000);
};picker.onchange=()=>{chosen=picker.value==='best'?0:Number(picker.value);try{localStorage.setItem('layali-movy-quality',picker.value==='best'?'best':data.sources[chosen].label)}catch{}loadSource(chosen)};let preference='best';try{preference=localStorage.getItem('layali-movy-quality')||'best'}catch{}if(preference!=='best'){const index=data.sources.findIndex(s=>s.label===preference);if(index>=0){chosen=index;picker.value=String(index)}}subtitleControl(video,data.subtitles||[],toolbar,current);loadSource(chosen)}catch{if(current())$('#player').innerHTML='<p class="notice" role="alert">This video source is unavailable right now. Retry playback or choose another title.</p>'}finally{if(current()){$('#detail-play').disabled=false;$('#detail-play').textContent='↻ Retry playback'}}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)navigate(b.dataset.view);if(b.dataset.slide!==undefined)setHero(Number(b.dataset.slide));if(b.dataset.open)openDetails(allItems().find(x=>x.slug===b.dataset.open),true);if(b.dataset.save)save(allItems().find(x=>x.slug===b.dataset.save));if(b.dataset.row)$('#row-'+b.dataset.row).scrollBy({left:Number(b.dataset.dir)*650,behavior:'smooth'});if(b.dataset.episode){episode=Number(b.dataset.episode);startPlayback();loadSeason()}if(b.dataset.genre){const ids={'Comedy':35,'Action':28,'Drama':18,'Horror':27,'Romance':10749,'Adventure':12,'Science Fiction':878,'Animation':16};navigate('movie',{id:ids[b.dataset.genre],name:b.dataset.genre})}});$('#hero-play').onclick=()=>openDetails(heroes()[activeHero],true);$('#hero-info').onclick=()=>openDetails(heroes()[activeHero]);$('#detail-play').onclick=startPlayback;$('#detail-save').onclick=()=>save(selected);$('#close').onclick=()=>$('#details').close();$('#details').addEventListener('close',()=>{if($('#details').open)return;stopPlayer();selected=null});$('#details').onclick=e=>{if(e.target===$('#details'))$('#details').close()};$('#search-button').onclick=()=>{navigate('search');$('#search').focus()};$('#search').oninput=()=>{clearTimeout(searchTimer);pageNumber=1;searchTimer=setTimeout(()=>browse(),350)};$('#load-more').onclick=()=>{pageNumber++;browse(true)};$('#season').onchange=()=>{season=Number($('#season').value);episode=1;loadSeason()};renderHome();api('/api/home').then(d=>{home=d;if(view==='home')renderHome()}).catch(()=>toast('Showing the saved catalog. Live updates are temporarily unavailable.'));
</script></body></html>
